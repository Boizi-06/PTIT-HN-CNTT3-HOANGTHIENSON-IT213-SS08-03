# ===================================================================
# RIKKEI CRM TICKET ASSISTANT - BÀI 3: DEFENSIVE RAG RETRIEVAL
# ===================================================================

# 1. Tên ứng dụng
spring.application.name=crm-defensive-rag-retrieval

# 2. Cấu hình Datasource Supabase Cloud (Supavisor Connection Pooler Port 6543)
spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.your_project_id
spring.datasource.password=YourSecurePassword
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. HikariCP Connection Pool (Giới hạn tối đa 4 kết nối cho Free Tier)
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# 4. Cấu hình Spring AI PGVector Store (Cosine Distance Operator <=> trong Postgres)
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.dimension=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.initialize-schema=true

# 5. Cấu hình Spring AI Ollama (Chat & Embedding Models)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.embedding.options.model=nomic-embed-text

# 6. Cấu hình Tham Số RAG Phòng Thủ (Defensive RAG Configuration)
crm.rag.similarity-threshold=0.75
crm.rag.top-k=3
crm.rag.fallback-message=Xin lỗi, thông tin bạn tìm kiếm không nằm trong tài liệu quy chế của chúng tôi.

# 7. Cấu hình Logging
logging.level.root=INFO
logging.level.com.rikkei.crm=DEBUG
logging.level.org.springframework.ai=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
